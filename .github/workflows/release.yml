name: Release

# 推一个 v* 的 tag 就自动出 Windows 安装包 + Android APK 并发布 Release：
#
#   git tag -a v1.0.0 -m "Novel Studio v1.0.0"
#   git push origin v1.0.0
#
# workflow_dispatch 只构建、不发布，产物可在 Actions 页面的 Artifacts 里下载，
# 用来在不真正发版的情况下验证这套流程还能跑通。
#
# ── Android 签名（可选，但正式发版应当配置）────────────────────────────
# 配置下面四个仓库 Secret 后，android job 会构建**签名 release APK**：
#   ANDROID_KEYSTORE_BASE64     release.jks 的 base64（base64 -w0 release.jks）
#   ANDROID_KEYSTORE_PASSWORD   keystore 密码
#   ANDROID_KEY_ALIAS           key alias（本机默认 novelstudio）
#   ANDROID_KEY_PASSWORD        key 密码
# 未配置时退回 debug APK，并在日志与产物名里标明「debug」。
# **keystore 与密码只存在于 Secrets，不进仓库、不打印。**
#
# ── action 版本不得下调 ────────────────────────────────────────────────
# GitHub 已于 2026-09-16 从 runner 上移除 Node 20 运行时，仍按 Node 20 打包的
# action 会被强制跑在 Node 24 上。多数能凑合跑，但 setup-android 的 v3 会直接崩
# （2026-09-19 实测：卡在该 action 自身，后续 step 全部 skipped）。
# 下面这些是各自「最低支持 node24」的大版本，注意中间版本仍是 node20：
#   upload-artifact  v5 还是 node20，必须 ≥ v6
#   download-artifact v6 还是 node20，必须 ≥ v7
#
# ── Node 版本不得降到 22 以下 ──────────────────────────────────────────
# @capacitor/cli 的 engines 声明是 ">=22.0.0"，版本不够时它会在启动时直接
# [fatal] 退出（不是警告）。android job 的 `npx cap sync android` 会因此失败，
# 而 windows job 不跑 cap，所以不会暴露——曾用 node 20 踩过这个坑。
# 这里用 24，与本机开发环境（v24.19.0）保持一致。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# release job 需要 contents: write 才能创建 Release
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # .npmrc 里的 npmmirror 镜像随仓库一起走，换机/上 CI 都能装上 Electron
      - name: 安装依赖
        run: npm ci

      # Node 内置测试（node --test），不引入第三方依赖。只用纯函数与内存对象，
      # 不碰 IndexedDB / Electron，所以能在 CI 上稳定跑。Electron 冒烟测试
      # 依赖 GUI 会话，仍然只作为发版前的手工验收（见 README「测试」）。
      - name: 单元测试
        run: npm test

      # --publish never：发布统一交给最后的 release job。
      # 不加这个时 electron-builder 在 CI + tag 环境下可能自己去发一次，
      # 与 release job 抢同一个 Release。
      - name: 构建 Windows 安装版 + 便携版
        run: |
          npm run build
          npx electron-builder --win --publish never

      # CLAUDE.md 约定 #4：asar 条目数应当在 20 上下，到几百就是打包配置漏了
      # （曾经把 @capacitor/android 的 499 个源文件打进安装包）。
      - name: 校验 asar 条目数
        shell: bash
        run: |
          count=$(npx asar list release/win-unpacked/resources/app.asar | wc -l)
          echo "asar 条目数：$count"
          if [ "$count" -gt 80 ]; then
            echo "::error::asar 条目数 $count 明显偏高，检查 electron-builder.yml 的 '!node_modules/**' 是否还在"
            exit 1
          fi

      # 必须在上传前改成纯 ASCII 文件名：GitHub 的 artifact 上传→下载这一轮
      # 会把文件名里的非 ASCII 字符直接丢掉。便携版原叫「Novel-Studio-便携版.exe」，
      # 走完一轮变成了「Novel-Studio-.exe」——既看不出是便携版，也和 README 里
      # 写的名字对不上。v1.0.0 实际踩过，故此处显式重命名。
      # 本地 `npm run dist:win` 仍产出原来的中文名，仅发布链路上改。
      - name: 重命名产物为 ASCII
        shell: bash
        run: |
          set -e
          mv release/"Novel Studio Setup "*.exe "Novel-Studio-Setup-${GITHUB_REF_NAME}.exe"
          mv release/"Novel-Studio-"*.exe       "Novel-Studio-Portable-${GITHUB_REF_NAME}.exe"
          ls -la Novel-Studio-*.exe

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: Novel-Studio-*.exe
          if-no-files-found: error

  # 可选：冒烟测试（232 项断言）。CI 上跑 Electron 需要 GUI 会话，
  # 偶有 flaky，默认关闭；想开就把下面的 if 删掉。
  #  smoke:
  #    runs-on: windows-latest
  #    steps:
  #      - uses: actions/checkout@v5
  #      - uses: actions/setup-node@v5
  #        with: { node-version: '24', cache: npm }
  #      - run: npm ci
  #      - run: npm run build
  #      - run: npx electron .
  #        env: { SMOKE_TEST: '1' }

  # ---------------------------------------------------------------- Android
  android:
    runs-on: ubuntu-latest
    env:
      # 用 job 级 env 判断 Secrets 是否存在：`secrets` 上下文在 step 的 `if`
      # 里不保证可用，而 `env` 上下文在所有 step 里都能读。
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # JDK 21 是硬要求：Capacitor 8 的 build.gradle 写死 VERSION_21，
      # 而 Gradle 8.14.3 最高只支持 Java 24（见 CLAUDE.md）
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: 安装 Android SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 安装依赖
        run: npm ci

      # 同一套单元测试再跑一遍：windows 与 ubuntu 的路径/编码差异真的会出问题
      # （例如 test 里显式写 `.js` 扩展名、路径分隔符），只在一个平台跑会漏掉。
      - name: 单元测试
        run: npm test

      # 拆成两步而非一条 run：日志正文要仓库管理员权限才读得到，
      # 但 step 级结论是公开可读的，分开才能定位是哪条命令挂的。
      - name: 构建渲染层（vite build）
        run: npm run build

      - name: 同步进原生工程（cap sync）
        run: npx cap sync android

      # gradle-wrapper.properties 里的腾讯镜像是给中国大陆本机用的，
      # GitHub 的 runner 在境外，这里临时换回官方源（只改 CI 里的这一份副本）
      - name: Gradle 发行包换回官方源
        run: sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' android/gradle/wrapper/gradle-wrapper.properties

      # 签名材料由 Secrets 还原。文件只落在 runner 的工作目录里，构建结束即随
      # runner 销毁；**任何一步都不打印 keystore 或密码**。
      # 用 env 传值而不是把 ${{ secrets.* }} 直接拼进 shell：密码里可能有引号、
      # 反斜杠或 `$`，直接插入会被 shell 再次解释。
      - name: 还原 release 签名材料
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/release.jks
          umask 077
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-novelstudio}"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
          echo "签名材料已还原（内容不打印）"

      # 配置了 Secrets 就出签名 release APK；否则退回 debug，并明确标注。
      # 两条路都不加 `--no-daemon` 之外的开关：构建参数必须与本机一致。
      - name: 构建 APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          if [ "$HAS_ANDROID_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            echo "::warning::未配置 Android 签名 Secrets，本次构建 debug APK（不可用于覆盖升级）"
            ./gradlew assembleDebug --no-daemon
          fi

      - name: 校验 APK（版本号 / 签名）
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            APK=android/app/build/outputs/apk/release/app-release.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          else
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            echo "::warning::这是 debug APK"
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -3

      - name: 重命名 APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            mv android/app/build/outputs/apk/release/app-release.apk \
               "Novel-Studio-Android-${GITHUB_REF_NAME}-release.apk"
          else
            mv android/app/build/outputs/apk/debug/app-debug.apk \
               "Novel-Studio-Android-${GITHUB_REF_NAME}-debug.apk"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: Novel-Studio-Android-*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  release:
    needs: [windows, android]
    # workflow_dispatch 跑进来的没有 tag，只出 Artifacts、不发 Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # 重跑同一个 tag 时，Release 上会残留上一次的产物（比如改名前的旧文件），
      # 而 action-gh-release 只覆盖同名资产、不会删多余的。先清空再上传，
      # 保证资产列表与本次构建严格一致。GitHub 托管的 runner 自带 gh CLI。
      - name: 清空该 Release 上的既有产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' \
              | while IFS= read -r n; do
                  [ -n "$n" ] && gh release delete-asset "$GITHUB_REF_NAME" "$n" --yes
                done
          else
            echo "Release $GITHUB_REF_NAME 尚不存在，跳过清理"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          name: Novel Studio ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
